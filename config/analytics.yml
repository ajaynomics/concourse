# Rybbit is opt-in. Leave the site ID blank to disable it. Configure the host
# and use a dedicated v3 site for signed-out page views, without session replay.
# Earlier release lines use their existing analytics settings.
shared:
  host: <%= Rails.app.creds.option(:rybbit, :host) %>
  site_id: <%= Rails.app.creds.option(:rybbit, :site_id) %>

development:
  site_id:

test:
  host: https://rybbit.example.com
  site_id:
