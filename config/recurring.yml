production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purge_expired_tasks:
    class: PurgeExpiredTasksJob
    schedule: every day at 3am
  recover_due_relay_tasks:
    class: RelaySweepJob
    schedule: every minute
  alert_stuck_mail:
    class: StuckMailAlertJob
    schedule: every 10 minutes
  # /connect codes live ten minutes; their encrypted secrets should not outlive them long.
  purge_connect_grants:
    command: "ConnectGrant.purge_stale"
    schedule: every 10 minutes
