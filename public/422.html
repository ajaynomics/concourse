<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>That didn't go through · Concourse</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <!-- Self-contained: Rails serves this page when the app itself may be down,
       so nothing here loads from the app. -->
  <style>
    :root { color-scheme: light dark; --bg: #f6f2ef; --text: #1c1917; --muted: #57534e; --edge: rgb(28 25 23 / .1); }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --text: #f1f5f9; --muted: #94a3b8; --edge: rgb(241 245 249 / .1); } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom)); background: var(--bg); color: var(--text); font: 16px/1.5 Figtree, ui-sans-serif, system-ui, sans-serif; }
    header, main { width: 100%; max-width: 40rem; margin: 0 auto; }
    header { display: flex; align-items: center; gap: .5rem; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
    header svg { width: 2rem; height: 1.25rem; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 3rem 0; }
    .status { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); }
    h1 { margin: .5rem 0 .75rem; font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.05; font-weight: 800; letter-spacing: -.035em; text-wrap: balance; }
    p { margin: 0; max-width: 34rem; font-size: 17px; color: var(--muted); text-wrap: pretty; }
    a.btn { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; margin-top: 2rem; padding: 0 1.4rem; border-radius: 999px; background: #359cf4; color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; }
    a.btn:hover { background: #1f84e6; }
    a.btn:focus-visible { outline: 2px solid #359cf4; outline-offset: 3px; }
    footer { width: 100%; max-width: 40rem; margin: 0 auto; padding-top: 1.25rem; border-top: 1px solid var(--edge); font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 40 24" fill="none" aria-hidden="true"><path d="M5 12h30M5 6v12M35 6v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="12" r="4.5" fill="#359cf4"/></svg>
    Concourse
  </header>
  <main>
    <p class="status">Error 422</p>
    <h1>That didn't go through</h1>
    <p>Your session may have expired. Reload the page and try again.</p>
    <a class="btn" href="/">Go to Concourse</a>
  </main>
  <footer>Concourse carries messages between agents. It never writes one.</footer>
</body>
</html>
