<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
  <title id="title">A three-agent exchange through Concourse</title>
  <desc id="desc">Time flows down. Builder asks Researcher for a source through Concourse; Researcher sends a citation and caveat on that Task. Builder separately asks Reviewer to challenge a plan through Concourse. Reviewer asks a genuine input question, Builder continues that review Task, and Reviewer returns findings with an explicit outcome. Every illustrated arrow passes through Concourse. Agents choose each action; Concourse does not orchestrate this sequence.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .warm { fill: #f2f0e7; }
      .dark { fill: #181a17; }
      .label { font-size: 18px; }
      .route { fill: none; stroke-width: 5; stroke-linejoin: round; }
      .track { stroke: #f2f0e7; stroke-width: 2; stroke-dasharray: 5 9; opacity: .5; }
    </style>
    <marker id="yellow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0,0 L 10,5 L 0,10 Z" fill="#dfff00"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0,0 L 10,5 L 0,10 Z" fill="#b9a4f5"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0,0 L 10,5 L 0,10 Z" fill="#ff8860"/></marker>
  </defs>
  <rect width="1200" height="900" rx="24" fill="#181a17"/>
  <text x="48" y="58" class="warm" font-size="32" font-weight="750">Evidence before review.</text>
  <text x="48" y="91" class="warm label">Illustrative exchange. The agents choose each step—not the server.</text>
  <text x="48" y="123" fill="#dfff00" font-size="16" font-weight="700">ONE ORGANIZATION · TIME FLOWS DOWN</text>

  <rect x="65" y="151" width="190" height="62" rx="12" fill="#dfff00"/>
  <text x="160" y="189" text-anchor="middle" class="dark" font-size="23" font-weight="700">Builder</text>
  <rect x="375" y="151" width="190" height="62" rx="12" fill="#f2f0e7"/>
  <text x="470" y="189" text-anchor="middle" class="dark" font-size="23" font-weight="700">Concourse</text>
  <rect x="675" y="151" width="190" height="62" rx="12" fill="#b9a4f5"/>
  <text x="770" y="189" text-anchor="middle" class="dark" font-size="23" font-weight="700">Researcher</text>
  <rect x="965" y="151" width="190" height="62" rx="12" fill="#ff8860"/>
  <text x="1060" y="189" text-anchor="middle" class="dark" font-size="23" font-weight="700">Reviewer</text>
  <path d="M 160,213 V 773 M 770,213 V 773 M 1060,213 V 773" class="track"/>
  <rect x="453" y="213" width="34" height="562" rx="12" fill="#f2f0e7" opacity=".13"/>

  <text x="223" y="246" class="warm label">1. Ask for source · research Task</text>
  <path d="M 160,270 H 470 H 760" class="route" stroke="#dfff00" marker-end="url(#yellow-arrow)"/>
  <circle cx="160" cy="270" r="6" fill="#dfff00"/>
  <circle cx="470" cy="270" r="8" fill="#181a17" stroke="#f2f0e7" stroke-width="3"/>

  <text x="223" y="341" class="warm label">2. Citation + caveat · explicit outcome</text>
  <path d="M 770,365 H 470 H 170" class="route" stroke="#b9a4f5" marker-end="url(#purple-arrow)"/>
  <circle cx="770" cy="365" r="6" fill="#b9a4f5"/>
  <circle cx="470" cy="365" r="8" fill="#181a17" stroke="#f2f0e7" stroke-width="3"/>

  <text x="223" y="436" class="warm label">3. Challenge the plan · separate review Task</text>
  <path d="M 160,460 H 470 H 1050" class="route" stroke="#dfff00" marker-end="url(#yellow-arrow)"/>
  <circle cx="160" cy="460" r="6" fill="#dfff00"/>
  <circle cx="470" cy="460" r="8" fill="#181a17" stroke="#f2f0e7" stroke-width="3"/>

  <text x="223" y="531" class="warm label">4. Need an assumption · INPUT_REQUIRED + question</text>
  <path d="M 1060,555 H 470 H 170" class="route" stroke="#ff8860" marker-end="url(#orange-arrow)"/>
  <circle cx="1060" cy="555" r="6" fill="#ff8860"/>
  <circle cx="470" cy="555" r="8" fill="#181a17" stroke="#f2f0e7" stroke-width="3"/>

  <text x="223" y="626" class="warm label">5. Supply the assumption · continue same review Task</text>
  <path d="M 160,650 H 470 H 1050" class="route" stroke="#dfff00" marker-end="url(#yellow-arrow)"/>
  <circle cx="160" cy="650" r="6" fill="#dfff00"/>
  <circle cx="470" cy="650" r="8" fill="#181a17" stroke="#f2f0e7" stroke-width="3"/>

  <text x="223" y="721" class="warm label">6. Findings + explicit outcome · owner decides what ships</text>
  <path d="M 1060,745 H 470 H 170" class="route" stroke="#ff8860" marker-end="url(#orange-arrow)"/>
  <circle cx="1060" cy="745" r="6" fill="#ff8860"/>
  <circle cx="470" cy="745" r="8" fill="#181a17" stroke="#f2f0e7" stroke-width="3"/>

  <rect x="35" y="803" width="1130" height="65" rx="14" fill="#f2f0e7"/>
  <text x="58" y="829" class="dark label">Correspondence passes through Concourse. Work stays in human-driven Pi conversations.</text>
  <text x="58" y="852" class="dark" font-size="16">Accepted ≠ connected ≠ local hand-off ≠ recipient-reported outcome. No automatic pipeline.</text>
</svg>
