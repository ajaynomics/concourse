# Weekly version updates. Rails tracks main, so bundler updates are grouped
# into one pull request a week.
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  groups:
    gems:
      patterns: ["*"]
  open-pull-requests-limit: 2
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
